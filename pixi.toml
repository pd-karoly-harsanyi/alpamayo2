# PD-internal bootstrap for running this repo on the Nebius Ray cluster (see PD_EVAL_PLAN.md).
#
# pixi does NOT replace NVIDIA's `uv.lock`: the model environment is still `uv sync --locked`
# from `pyproject.toml` + `uv.lock`, exactly as the README says. pixi only supplies the tools the
# Ray worker's base image may lack - a Python 3.12 interpreter, `uv` and `git` - so that
# `scripts/nebius_entrypoint.sh` can build the model env on the node without `nvcc` (the one
# package that would need it, flash-attn, is installed from the prebuilt GitHub-release wheel).
#
#   pixi install --locked -e default    # on the Ray worker (the entrypoint does this)
#   pixi run -e launch submit-nebius    # from a laptop: Ray Jobs API client only
#
# `pixi.toml` takes precedence over `pyproject.toml` when both exist, so pixi never tries to
# interpret NVIDIA's project table.

[workspace]
name = "alpamayo2-eval"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
uv = ">=0.9.7"
git = "*"

# Submitting machine only. Pinned to the cluster's Ray (2.55.1, same as pd-fm's `launch` env)
# for Jobs-API compatibility; the worker never imports ray.
[feature.launch.pypi-dependencies]
ray = { version = "==2.55.1", extras = ["default"] }
boto3 = ">=1.34"  # mirror-export (laptop copies between AWS and Nebius) and credential forwarding

# Laptop-side CPU tools: loader tests (`pixi run -e dev test-pd`) and the results video
# (`pixi run -e dev make-video <run uri>`). No model, no GPU.
[feature.dev.dependencies]
pytorch-cpu = "2.*"
scipy = "*"
pillow = "*"
numpy = "*"
einops = "*"
pytest = "*"
matplotlib = "*"
ffmpeg = "*"
boto3 = "*"
dash = ">=2.17"
plotly = ">=5.20"
pandas = "*"

# Headless browser for dashboard layout tests (PyPI package; conda-forge's "playwright" is the Node CLI).
[feature.dev.pypi-dependencies]
playwright = ">=1.40"
transformers = "==4.57.1"  # same as the model env (uv.lock); for the CPU test of the attention capture

[environments]
default = { solve-group = "default" }
launch = { features = ["launch"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tasks]
# Pass-through: `pixi run -e launch submit-nebius probe --wait`
submit-nebius = "python scripts/submit_nebius.py"
# Laptop copy between the artifact bucket (AWS, `default` profile) and Nebius (`nebius` profile).
mirror-export = "python pd_alpamayo_eval/mirror_export.py"

[tasks.test-pd]
cmd = "pytest -q tests/test_pd_load_export.py tests/test_pd_cot_differs.py tests/test_pd_attention.py tests/test_pd_ablation.py tests/test_diffusion_seed.py tests/test_vision_patch_embed.py tests/test_expert_attention_recording.py tests/test_inference_sample.py tests/test_sample_trajectories_plumbing.py"
env = { PYTHONPATH = "src:." }

# Side-by-side video of a run: `pixi run -e dev make-video s3://pd-nebius-ray/alpamayo-eval/<name>/runs/<id>`
[tasks.make-video]
cmd = "python pd_alpamayo_eval/make_video.py"
env = { PYTHONPATH = "src:." }

# Noise floor vs replica effect: `pixi run -e dev compare-runs <run A> <run B> ...`
[tasks.compare-runs]
cmd = "python pd_alpamayo_eval/compare_runs.py"
env = { PYTHONPATH = "src:." }

# Small experiments: `pixi run -e dev quick madrid --times 0.0 4.2` (submits, waits, writes contact sheets to outputs/quick/)
[tasks.quick]
cmd = "python pd_alpamayo_eval/quick.py"
env = { PYTHONPATH = "src:." }

# Interactive inspection: `pixi run -e dev dashboard <run A> [<run B> ...]`, then open http://localhost:8050
[tasks.dashboard]
cmd = "python pd_alpamayo_eval/dashboard.py"
env = { PYTHONPATH = "src:." }
